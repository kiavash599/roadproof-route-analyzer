name: Desktop installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/desktop-release.yml"
      - "build-resources/**"
      - "desktop/**"
      - "app/**"
      - "lib/**"
      - "worker/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CSC_LINK }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run desktop:smoke
      - name: Configure Windows signing
        if: env.WINDOWS_CERTIFICATE != ''
        shell: bash
        run: |
          echo "CSC_LINK=$WINDOWS_CERTIFICATE" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$WINDOWS_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
      - run: npm run desktop:dist
      - uses: actions/upload-artifact@v4
        with:
          name: RoadProof-Windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            release_tag="$GITHUB_REF_NAME"
            gh release create "$release_tag" artifacts/**/* --generate-notes --verify-tag
          else
            package_version=$(node -e "process.stdout.write(require('./package.json').version)")
            release_tag="v${package_version}"
            if gh release view "$release_tag" >/dev/null 2>&1; then
              echo "Release $release_tag already exists. Bump package.json before publishing another installer release." >&2
              exit 1
            fi
            gh release create "$release_tag" artifacts/**/* --generate-notes --target "$GITHUB_SHA"
          fi
