name: Remove legacy macOS release assets

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/remove-legacy-macos-assets.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Remove legacy macOS release assets'
    runs-on: ubuntu-latest
    steps:
      - name: Delete verified legacy macOS assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          assets=(
            "latest-mac.yml"
            "RoadProof-1.0.0-mac-universal.dmg"
            "RoadProof-1.0.0-mac-universal.dmg.blockmap"
            "RoadProof-1.0.0-mac-universal.pkg"
            "RoadProof-1.0.0-mac-universal.zip"
            "RoadProof-1.0.0-mac-universal.zip.blockmap"
          )
          for asset in "${assets[@]}"; do
            gh release delete-asset v1.0.0 "$asset" --repo "$GITHUB_REPOSITORY" --yes || true
          done
          remaining=$(gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          if grep -E 'latest-mac|mac-universal|\.dmg$|\.pkg$' <<<"$remaining"; then
            echo "A verified macOS asset still exists." >&2
            exit 1
          fi
